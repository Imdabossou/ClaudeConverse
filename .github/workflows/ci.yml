# Checks every push to main and development, and every pull request.
name: CI

on:
  push:
    branches: [main, development]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Python (syntax errors and pyflakes)
        run: |
          python3 -m py_compile converse-server/server.py
          pipx run ruff check --select E9,F converse-server
      - name: Shell scripts
        run: shellcheck -S error *.sh
